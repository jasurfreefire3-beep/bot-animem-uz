[package]
name = "bot-animem-uz"
version = "0.1.0"
description = "Anime Backend App"

[build]
command = "npm run build"

[[module]]
name = "server"
source = "dist/server.cjs"

[[command]]
name = "start"
module = "server"
runner = "wasmer/js"

[app]
public = true

[[app.routes]]
path = "/*"
backend = "command:start"
